<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NELSON 地理第三单元互动小测试</title>
  <style>
    :root {
      --ink: #17313a;
      --muted: #63777d;
      --line: #cbdbe0;
      --panel: rgba(255, 253, 247, 0.93);
      --teal: #177e89;
      --teal-dark: #0d5863;
      --coral: #e76f51;
      --gold: #e9b949;
      --blue: #3a6ea5;
      --good: #207f5f;
      --bad: #b9423a;
      --shadow: 0 18px 55px rgba(18, 47, 55, 0.16);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.64), rgba(246,250,248,0.96)),
        url("nelson-geography-bg.png") center top / cover fixed;
    }
    .shell { width: min(1120px, calc(100% - 32px)); margin: 0 auto; padding: 24px 0 28px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .mark {
      width: 46px; height: 46px; border-radius: 8px; display: grid; place-items: center;
      color: white; font-weight: 850; background: linear-gradient(135deg, var(--teal), var(--blue));
      box-shadow: 0 12px 26px rgba(23, 126, 137, 0.25); flex: 0 0 auto;
    }
    h1 { margin: 0; font-size: clamp(22px, 3.6vw, 36px); line-height: 1.08; letter-spacing: 0; }
    .subtitle { margin-top: 5px; color: var(--muted); font-size: 14px; }
    .scorecard { display: grid; grid-template-columns: repeat(3, minmax(76px, 1fr)); gap: 8px; min-width: min(360px, 100%); }
    .metric { border: 1px solid rgba(203,219,224,.82); background: rgba(255,255,255,.78); border-radius: 8px; padding: 9px 10px; text-align: center; backdrop-filter: blur(10px); }
    .metric b { display: block; font-size: 20px; line-height: 1; color: var(--teal-dark); }
    .metric span { display: block; margin-top: 4px; color: var(--muted); font-size: 12px; }
    .layout { display: grid; grid-template-columns: 260px 1fr; gap: 18px; align-items: start; }
    aside, main { background: var(--panel); border: 1px solid rgba(203,219,224,.84); border-radius: 8px; box-shadow: var(--shadow); backdrop-filter: blur(13px); }
    aside { padding: 16px; position: sticky; top: 16px; }
    .stage-title { margin: 0 0 10px; font-size: 14px; color: var(--muted); font-weight: 800; }
    .stage-list { display: grid; gap: 8px; margin-bottom: 18px; }
    .stage-pill { border: 1px solid var(--line); background: white; color: var(--ink); border-radius: 8px; min-height: 48px; padding: 8px 10px; text-align: left; font: inherit; cursor: pointer; }
    .stage-pill.active { border-color: var(--teal); background: #eaf7f6; color: var(--teal-dark); font-weight: 800; }
    .stage-pill span { display: block; color: var(--muted); font-size: 12px; font-weight: 500; margin-top: 2px; }
    .question-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; }
    .dot { aspect-ratio: 1; border: 1px solid var(--line); background: white; color: var(--ink); border-radius: 6px; font: 700 12px/1 system-ui, sans-serif; cursor: pointer; }
    .dot.current { outline: 2px solid var(--teal); outline-offset: 2px; }
    .dot.correct { background: #dbf3e9; border-color: #82c9ad; color: var(--good); }
    .dot.wrong { background: #ffe5df; border-color: #ef9a87; color: var(--bad); }
    main { min-height: 620px; overflow: hidden; }
    .progress { height: 8px; background: rgba(203,219,224,.5); }
    .progress span { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--teal), var(--gold), var(--coral)); transition: width 260ms ease; }
    .card { padding: clamp(18px, 3vw, 30px); }
    .kicker { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; color: var(--muted); font-size: 14px; margin-bottom: 18px; }
    .badge { border-radius: 999px; background: #e9f4f1; color: var(--teal-dark); padding: 5px 9px; font-weight: 800; }
    .question { margin: 0 0 22px; font-size: clamp(22px, 3.2vw, 32px); line-height: 1.35; letter-spacing: 0; }
    .options { display: grid; gap: 11px; margin-bottom: 18px; }
    .option { display: grid; grid-template-columns: 42px 1fr; align-items: center; gap: 12px; width: 100%; min-height: 62px; border: 1px solid var(--line); border-radius: 8px; background: rgba(255,255,255,.92); color: var(--ink); padding: 10px 14px 10px 10px; text-align: left; font: inherit; cursor: pointer; transition: transform 140ms ease, border-color 140ms ease, background 140ms ease; }
    .option:hover { transform: translateY(-1px); border-color: var(--teal); }
    .option.selected { border-color: var(--teal); background: #eaf7f6; }
    .option.correct { border-color: #66b795; background: #daf4e9; }
    .option.wrong { border-color: #ec8d78; background: #ffe3dc; }
    .letter { width: 34px; height: 34px; border-radius: 7px; display: grid; place-items: center; color: white; background: var(--blue); font-weight: 900; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin-top: 18px; }
    .btn { border: 0; border-radius: 8px; min-height: 44px; padding: 0 16px; color: white; background: var(--teal); font: 800 15px/1 system-ui, sans-serif; cursor: pointer; box-shadow: 0 10px 20px rgba(23,126,137,.2); }
    .btn.secondary { background: white; color: var(--teal-dark); border: 1px solid var(--line); box-shadow: none; }
    .btn:disabled { opacity: .48; cursor: not-allowed; box-shadow: none; }
    .feedback { display: none; margin-top: 18px; border-radius: 8px; border: 1px solid var(--line); background: white; padding: 16px; }
    .feedback.show { display: block; }
    .feedback.good { border-color: #8ccfb5; background: #ecfaf4; }
    .feedback.bad { border-color: #ef9b87; background: #fff0ec; }
    .feedback h2 { margin: 0 0 8px; font-size: 20px; letter-spacing: 0; }
    .feedback p { margin: 8px 0 0; color: #314a50; line-height: 1.7; }
    .analysis { white-space: pre-line; }
    .result { display: none; padding: clamp(18px, 3vw, 30px); }
    .result.show { display: block; }
    .result h2 { margin: 0 0 10px; font-size: clamp(24px, 4vw, 36px); letter-spacing: 0; }
    .review-list { display: grid; gap: 10px; margin-top: 18px; }
    .review-item { border: 1px solid var(--line); background: white; border-radius: 8px; padding: 12px; line-height: 1.55; }
    @media (max-width: 820px) {
      .topbar { align-items: stretch; flex-direction: column; }
      .scorecard { min-width: 0; }
      .layout { grid-template-columns: 1fr; }
      main { order: 1; min-height: 0; }
      aside { order: 2; position: static; }
      .question-grid { grid-template-columns: repeat(10, 1fr); }
    }
    @media (max-width: 520px) {
      .shell { width: min(100% - 20px, 1120px); padding-top: 12px; }
      .scorecard { grid-template-columns: repeat(3, 1fr); }
      .metric { padding: 8px 6px; }
      .question-grid { grid-template-columns: repeat(5, 1fr); }
      .option { grid-template-columns: 34px 1fr; padding-right: 10px; }
      .letter { width: 30px; height: 30px; }
      .actions { align-items: stretch; flex-direction: column; }
      .btn { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <div class="mark" aria-hidden="true">N</div>
        <div>
          <h1>NELSON 地理第三单元互动小测试</h1>
          <div class="subtitle">五四学制六年级下册复习：第三单元《走近国家》</div>
        </div>
      </div>
      <div class="scorecard" aria-label="答题统计">
        <div class="metric"><b id="score">0</b><span>答对</span></div>
        <div class="metric"><b id="streak">0</b><span>连续</span></div>
        <div class="metric"><b id="accuracy">0%</b><span>正确率</span></div>
      </div>
    </header>
    <div class="layout">
      <aside>
        <p class="stage-title">复习阶段</p>
        <div class="stage-list" id="stageList"></div>
        <p class="stage-title">题目导航</p>
        <div class="question-grid" id="questionGrid"></div>
      </aside>
      <main>
        <div class="progress" aria-hidden="true"><span id="progressBar"></span></div>
        <section class="card" id="quizCard">
          <div class="kicker"><span class="badge" id="stageBadge"></span><span id="questionCounter"></span><span id="stageNote"></span></div>
          <h2 class="question" id="questionText"></h2>
          <div class="options" id="options"></div>
          <div class="actions">
            <button class="btn secondary" id="prevBtn" type="button">上一题</button>
            <button class="btn" id="submitBtn" type="button">提交答案</button>
            <button class="btn secondary" id="nextBtn" type="button">下一题</button>
          </div>
          <div class="feedback" id="feedback"></div>
        </section>
        <section class="result" id="result">
          <h2 id="resultTitle"></h2>
          <p id="resultText"></p>
          <div class="actions">
            <button class="btn" id="restartBtn" type="button">重新挑战</button>
            <button class="btn secondary" id="reviewWrongBtn" type="button">查看错题</button>
          </div>
          <div class="review-list" id="reviewList"></div>
        </section>
      </main>
    </div>
  </div>

      stageList: document.querySelector("#stageList"), questionGrid: document.querySelector("#questionGrid"),
      score: document.querySelector("#score"), streak: document.querySelector("#streak"), accuracy: document.querySelector("#accuracy"),
      progressBar: document.querySelector("#progressBar"), stageBadge: document.querySelector("#stageBadge"),
      questionCounter: document.querySelector("#questionCounter"), stageNote: document.querySelector("#stageNote"),
      questionText: document.querySelector("#questionText"), options: document.querySelector("#options"), feedback: document.querySelector("#feedback"),
      prevBtn: document.querySelector("#prevBtn"), submitBtn: document.querySelector("#submitBtn"), nextBtn: document.querySelector("#nextBtn"),
      quizCard: document.querySelector("#quizCard"), result: document.querySelector("#result"), resultTitle: document.querySelector("#resultTitle"),
      resultText: document.querySelector("#resultText"), restartBtn: document.querySelector("#restartBtn"),
      reviewWrongBtn: document.querySelector("#reviewWrongBtn"), reviewList: document.querySelector("#reviewList"),
    };
    const stageStarts = [
      { label: "基础常考点", start: 0, end: 24 },
      { label: "易错点梳理", start: 25, end: 39 },
      { label: "重难点攻关", start: 40, end: 49 },
    ];
    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, char => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[char]));
    }
    function answeredCount() { return state.answered.filter(Boolean).length; }
    function updateStats() {
      const done = answeredCount();
      els.score.textContent = state.score; els.streak.textContent = state.streak;
      els.accuracy.textContent = done ? Math.round((state.score / done) * 100) + "%" : "0%";
      els.progressBar.style.width = `${(done / questions.length) * 100}%`;
    }
    function buildStageList() {
      els.stageList.innerHTML = stageStarts.map(stage => `<button class="stage-pill" type="button" data-jump="${stage.start}">${stage.label}<span>${stage.start + 1}-${stage.end + 1}题</span></button>`).join("");
      els.stageList.querySelectorAll("button").forEach(button => button.addEventListener("click", () => goTo(Number(button.dataset.jump))));
    }
    function buildGrid() {
      els.questionGrid.innerHTML = questions.map((question, index) => `<button class="dot" type="button" data-index="${index}" aria-label="第${question.id}题">${question.id}</button>`).join("");
      els.questionGrid.querySelectorAll("button").forEach(button => button.addEventListener("click", () => goTo(Number(button.dataset.index))));
    }
    function renderQuestion() {
      const question = questions[state.index]; const record = state.answered[state.index]; state.selected = record ? record.selected : null;
      els.quizCard.style.display = ""; els.result.classList.remove("show");
      els.stageBadge.textContent = question.stage; els.questionCounter.textContent = `第 ${question.id} / ${questions.length} 题`; els.stageNote.textContent = question.stageNote;
      els.questionText.textContent = question.prompt;
      els.options.innerHTML = Object.entries(question.options).map(([letter, text]) => `<button class="option" type="button" data-choice="${letter}"><span class="letter">${letter}</span><span>${escapeHtml(text)}</span></button>`).join("");
      els.options.querySelectorAll(".option").forEach(button => button.addEventListener("click", () => selectOption(button.dataset.choice)));
      els.prevBtn.disabled = state.index === 0; els.nextBtn.textContent = state.index === questions.length - 1 ? "看结果" : "下一题";
      els.submitBtn.disabled = Boolean(record); els.submitBtn.textContent = record ? "已提交" : "提交答案";
      if (record) { paintOptions(record.selected, question.answer); showFeedback(record.correct); } else { els.feedback.className = "feedback"; els.feedback.innerHTML = ""; }
      refreshNavigation(); updateStats();
    }
    function refreshNavigation() {
      els.questionGrid.querySelectorAll(".dot").forEach((button, index) => {
        const record = state.answered[index]; button.className = "dot";
        if (index === state.index) button.classList.add("current"); if (record?.correct) button.classList.add("correct"); if (record && !record.correct) button.classList.add("wrong");
      });
      els.stageList.querySelectorAll(".stage-pill").forEach((button, i) => {
        const stage = stageStarts[i]; button.classList.toggle("active", state.index >= stage.start && state.index <= stage.end);
      });
    }
    function selectOption(choice) {
      if (state.answered[state.index]) return; state.selected = choice;
      els.options.querySelectorAll(".option").forEach(button => button.classList.toggle("selected", button.dataset.choice === choice));
    }
    function paintOptions(selected, answer) {
      els.options.querySelectorAll(".option").forEach(button => {
        const choice = button.dataset.choice;
        button.classList.toggle("selected", choice === selected); button.classList.toggle("correct", choice === answer); button.classList.toggle("wrong", choice === selected && choice !== answer);
      });
    }
    function submitAnswer() {
      if (!state.selected || state.answered[state.index]) return;
      const question = questions[state.index]; const correct = state.selected === question.answer;
      if (correct) { state.score += 1; state.streak += 1; state.maxStreak = Math.max(state.maxStreak, state.streak); } else { state.streak = 0; }
      state.answered[state.index] = { selected: state.selected, correct };
      els.submitBtn.disabled = true; els.submitBtn.textContent = "已提交"; paintOptions(state.selected, question.answer); showFeedback(correct); refreshNavigation(); updateStats();
    }
    function showFeedback(correct) {
      const question = questions[state.index]; const answerText = `${question.answer}. ${question.options[question.answer]}`;
      const selectedText = state.selected ? `${state.selected}. ${question.options[state.selected]}` : "";
      els.feedback.className = `feedback show ${correct ? "good" : "bad"}`;
      if (correct) {
        els.feedback.innerHTML = `<h2>你太厉害了！连续答对第 ${state.streak} 题！</h2><p><strong>考点：</strong>${escapeHtml(question.concept)}</p><p>${escapeHtml(question.explanation)}</p>`;
        return;
      }
      els.feedback.innerHTML = `<h2>这题先收进错题本。</h2><p><strong>你的选择：</strong>${escapeHtml(selectedText)}</p><p><strong>正确答案：</strong>${escapeHtml(answerText)}</p><p><strong>考点：</strong>${escapeHtml(question.concept)}</p><p class="analysis"><strong>答案分析：</strong>${escapeHtml(question.explanation)}
做第三单元题时，先判断题目对应哪个国家，再抓住国家关键词：日本看岛国、地震和外向型工业；印度看季风、人口和软件外包；德国看鲁尔区转型；埃及看尼罗河和苏伊士运河；美国看农业带和高新技术；澳大利亚看特有生物、矿产和东南沿海。</p>`;
    }
    function goTo(index) { state.index = Math.max(0, Math.min(index, questions.length - 1)); renderQuestion(); }
    function next() { if (state.index === questions.length - 1) { showResult(); return; } goTo(state.index + 1); }
    function showResult() {
      const done = answeredCount(); const wrong = state.answered.map((record, index) => (record && !record.correct ? { record, question: questions[index] } : null)).filter(Boolean);
      const accuracy = done ? Math.round((state.score / done) * 100) : 0;
      els.quizCard.style.display = "none"; els.result.classList.add("show");
      els.resultTitle.textContent = `完成！${state.score} / ${questions.length} 题正确`;
      els.resultText.textContent = `正确率 ${accuracy}%，最高连续答对 ${state.maxStreak} 题。${wrong.length ? "下面可以集中复盘错题。" : "第三单元的国家特征抓得很稳，可以准备综合题了。"}`;
      els.reviewList.innerHTML = "";
    }
    function renderWrongReview() {
      const wrong = state.answered.map((record, index) => (record && !record.correct ? { record, question: questions[index] } : null)).filter(Boolean);
      if (!wrong.length) { els.reviewList.innerHTML = `<div class="review-item">没有错题，NELSON 这轮很稳。</div>`; return; }
      els.reviewList.innerHTML = wrong.map(item => {
        const q = item.question;
        return `<article class="review-item"><strong>第 ${q.id} 题：${escapeHtml(q.prompt)}</strong><br>你的答案：${escapeHtml(item.record.selected)}；正确答案：${escapeHtml(q.answer)}. ${escapeHtml(q.options[q.answer])}<br>考点：${escapeHtml(q.concept)}<br>解析：${escapeHtml(q.explanation)}</article>`;
      }).join("");
    }
    function restart() {
      state.index = 0; state.selected = null; state.answered = Array(questions.length).fill(null); state.score = 0; state.streak = 0; state.maxStreak = 0; renderQuestion();
    }
    els.submitBtn.addEventListener("click", submitAnswer); els.prevBtn.addEventListener("click", () => goTo(state.index - 1)); els.nextBtn.addEventListener("click", next);
    els.restartBtn.addEventListener("click", restart); els.reviewWrongBtn.addEventListener("click", renderWrongReview);
    buildStageList(); buildGrid(); renderQuestion();
  </script>
</body>
</html>
