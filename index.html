<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NELSON 地理互动小测试</title>
  <style>
    :root {
      --ink: #17313a;
      --muted: #63777d;
      --line: #cbdbe0;
      --teal: #177e89;
      --blue: #3a6ea5;
      --coral: #e76f51;
      --paper: rgba(255, 253, 247, 0.94);
      --shadow: 0 18px 55px rgba(18, 47, 55, 0.16);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.58), rgba(246,250,248,0.96)),
        url("nelson-geography-bg.png") center top / cover fixed;
    }
    main {
      width: min(920px, calc(100% - 32px));
      margin: 0 auto;
      padding: 32px 0;
    }
    header {
      margin-bottom: 22px;
    }
    .mark {
      width: 48px;
      height: 48px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      color: #fff;
      font-weight: 850;
      background: linear-gradient(135deg, var(--teal), var(--blue));
      box-shadow: 0 12px 26px rgba(23, 126, 137, 0.25);
      margin-bottom: 14px;
    }
    h1 {
      margin: 0;
      font-size: clamp(28px, 5vw, 48px);
      line-height: 1.1;
      letter-spacing: 0;
    }
    p {
      margin: 8px 0 0;
      color: var(--muted);
      line-height: 1.7;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }
    a {
      display: block;
      min-height: 180px;
      border: 1px solid rgba(203, 219, 224, 0.86);
      border-radius: 8px;
      background: var(--paper);
      color: var(--ink);
      text-decoration: none;
      padding: 20px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(13px);
      transition: transform 150ms ease, border-color 150ms ease;
    }
    a:hover {
      transform: translateY(-2px);
      border-color: var(--teal);
    }
    strong {
      display: block;
      font-size: clamp(22px, 4vw, 30px);
      line-height: 1.2;
      margin-bottom: 10px;
    }
    span {
      display: inline-block;
      margin-top: 18px;
      border-radius: 999px;
      padding: 7px 11px;
      color: #fff;
      background: var(--teal);
      font-weight: 800;
      font-size: 14px;
    }
    .unit-two span {
      background: var(--coral);
    }
    @media (max-width: 680px) {
      main { width: min(100% - 20px, 920px); padding-top: 18px; }
      .grid { grid-template-columns: 1fr; }
      a { min-height: 156px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="mark" aria-hidden="true">N</div>
      <h1>NELSON 地理互动小测试</h1>
      <p>五四学制六年级下册复习。选一个单元开始答题。</p>
    </header>
    <section class="grid" aria-label="单元入口">
      <a href="nelson-geography-quiz.html">
        <strong>第一单元</strong>
        <p>亚洲与非洲：大洲位置、地形、河流、气候和人口。</p>
        <span>开始第一单元</span>
      </a>
      <a class="unit-two" href="nelson-geography-unit2.html">
        <strong>第二单元</strong>
        <p>近观地区：东南亚、西亚、欧洲西部和极地地区。</p>
        <span>开始第二单元</span>
      </a>
    </section>
  </main>
</body>
</html>
